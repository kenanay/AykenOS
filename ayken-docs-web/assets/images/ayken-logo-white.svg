<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- White/light gradient for dark backgrounds -->
    <linearGradient id="logoGradientWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecf0f1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Turkish accent for white version -->
    <linearGradient id="turkishAccentWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e30a17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#logoGradientWhite)" stroke-width="2"/>
  
  <!-- Constitutional symbol - stylized "A" for AykenOS -->
  <path d="M 32 90 L 50 40 L 64 40 L 78 40 L 96 90 L 86 90 L 82 80 L 46 80 L 42 90 Z" 
        fill="url(#logoGradientWhite)" stroke="none"/>
  
  <!-- Horizontal bar of "A" -->
  <rect x="50" y="65" width="28" height="4" fill="url(#turkishAccentWhite)"/>
  
  <!-- Constitutional dots representing governance -->
  <circle cx="40" cy="100" r="2" fill="#ffd700"/>
  <circle cx="64" cy="100" r="2" fill="#ffd700"/>
  <circle cx="88" cy="100" r="2" fill="#ffd700"/>
  
  <!-- Stylized crescent and star (Turkish heritage) -->
  <path d="M 20 30 Q 15 20 25 25 Q 30 15 20 30" fill="#ffd700" opacity="0.8"/>
  <polygon points="30,20 32,25 37,25 33,28 35,33 30,30 25,33 27,28 23,25 28,25" 
           fill="#ffd700" opacity="0.8"/>
  
  <!-- Constitutional framework lines -->
  <line x1="10" y1="64" x2="25" y2="64" stroke="url(#logoGradientWhite)" stroke-width="1" opacity="0.6"/>
  <line x1="103" y1="64" x2="118" y2="64" stroke="url(#logoGradientWhite)" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="10" x2="64" y2="25" stroke="url(#logoGradientWhite)" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="103" x2="64" y2="118" stroke="url(#logoGradientWhite)" stroke-width="1" opacity="0.6"/>
</svg>