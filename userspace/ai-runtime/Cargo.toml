[package]
name = "ai-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
memmap2 = "0.9"
hex = "0.4"
libc = "0.2"
tempfile = "3.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.0"
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"
tokio-test = "0.4"