[package]
name = "proofd"
version = "0.1.0"
edition = "2021"
authors = ["Kenan AY"]
description = "AykenOS proofd read-only diagnostics service skeleton"

[[bin]]
name = "proofd"
path = "src/main.rs"

[dependencies]
proof-verifier = { path = "../../ayken-core/crates/proof-verifier" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.4"
