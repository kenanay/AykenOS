[package]
name = "proof-verifier"
version = "0.1.0"
edition = "2021"
description = "Phase-12 deterministic proof verification engine for AykenOS"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
