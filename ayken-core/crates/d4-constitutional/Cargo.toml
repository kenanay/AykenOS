[package]
name = "d4-constitutional"
version = "0.1.0"
edition = "2021"
description = "D4 Constitutional Addendum - Immutable architectural framework for register optimization governance"
license = "MIT OR Apache-2.0"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"

# Cryptographic dependencies for audit log integrity
sha2 = "0.10"
hex = "0.4"

# Property-based testing (consistent with D4 register optimization framework)
proptest = "1.0"
rand = { version = "0.8", features = ["std"] }
rand_chacha = "0.3"

[dev-dependencies]
# Additional testing dependencies
quickcheck = "1.0"
quickcheck_macros = "1.0"

[features]
default = []
# Feature for deterministic testing with fixed seeds
deterministic = []
# Feature for development with random seeds
development = []
runtime = []
