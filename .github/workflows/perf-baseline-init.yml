name: perf-baseline-init

on:
  workflow_dispatch:
    inputs:
      ci_image_digest:
        description: "Pinned runner image/build digest (required, ex: gha-ubuntu24-20260201.15.1-X64)"
        required: true
        default: ""

jobs:
  init_baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      RUN_ID: "init-${{ github.run_id }}-${{ github.run_attempt }}"
      PERF_INIT_BASELINE: "1"
      PERF_REQUIRE_CI_FOR_BASELINE_INIT: "1"
      PERF_QEMU_TIMEOUT: "30"
      PERF_KERNEL_PROFILE: "validation"
      PERF_ENV_MISMATCH_POLICY: "fail"
      PERF_ALLOW_BASELINE_LOCK_MUTATION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Load performance baseline authority
        run: |
          set -euo pipefail
          source scripts/ci/perf_authority.env
          : "${PERF_BASELINE_AUTHORITY:?PERF_BASELINE_AUTHORITY missing in scripts/ci/perf_authority.env}"
          echo "PERF_BASELINE_AUTHORITY=${PERF_BASELINE_AUTHORITY}" >> "$GITHUB_ENV"
          echo "Loaded PERF_BASELINE_AUTHORITY=${PERF_BASELINE_AUTHORITY}"
      
      - name: Install toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 clang lld nasm jq mtools
      
      - name: Resolve baseline init digest
        run: |
          set -euo pipefail
          INPUT_DIGEST="${{ github.event.inputs.ci_image_digest }}"
          DETECTED_DIGEST="gha-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH:-unknown}"
          if [ -z "${INPUT_DIGEST}" ]; then
            echo "ERROR: ci_image_digest input is required."
            echo "Detected runner digest candidate: ${DETECTED_DIGEST}"
            exit 1
          fi
          DIGEST="${INPUT_DIGEST}"
          echo "PERF_CI_IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "DETECTED_CI_IMAGE_DIGEST=${DETECTED_DIGEST}" >> "$GITHUB_ENV"
      
      - name: Validate baseline init digest
        run: |
          set -euo pipefail
          if [ -z "${PERF_CI_IMAGE_DIGEST}" ] || echo "${PERF_CI_IMAGE_DIGEST}" | grep -q "unknown"; then
            echo "ERROR: ci_image_digest is not pinned"
            echo "PERF_CI_IMAGE_DIGEST=${PERF_CI_IMAGE_DIGEST}"
            echo "DETECTED_CI_IMAGE_DIGEST=${DETECTED_CI_IMAGE_DIGEST:-unavailable}"
            exit 1
          fi
          if ! echo "${PERF_CI_IMAGE_DIGEST}" | grep -Eq '^gha-[A-Za-z0-9._-]+-[A-Za-z0-9._-]+-[A-Za-z0-9._-]+$'; then
            echo "ERROR: ci_image_digest format invalid"
            echo "Expected format: gha-<ImageOS>-<ImageVersion>-<RUNNER_ARCH>"
            echo "PERF_CI_IMAGE_DIGEST=${PERF_CI_IMAGE_DIGEST}"
            exit 1
          fi
          if [ -z "${DETECTED_CI_IMAGE_DIGEST:-}" ] || echo "${DETECTED_CI_IMAGE_DIGEST}" | grep -q "unknown"; then
            echo "ERROR: Could not resolve detected runner image digest"
            echo "DETECTED_CI_IMAGE_DIGEST=${DETECTED_CI_IMAGE_DIGEST:-unavailable}"
            exit 1
          fi
          if [ "${PERF_CI_IMAGE_DIGEST}" != "${DETECTED_CI_IMAGE_DIGEST}" ]; then
            echo "ERROR: Provided digest does not match actual runner image"
            echo "Provided: ${PERF_CI_IMAGE_DIGEST}"
            echo "Detected: ${DETECTED_CI_IMAGE_DIGEST}"
            exit 4
          fi
          echo "Using digest: ${PERF_CI_IMAGE_DIGEST}"
      
      - name: Validate baseline init environment (Darwin guard)
        run: |
          set -euo pipefail
          host_os="$(uname -s)"
          host_arch="$(uname -m)"
          echo "Host: ${host_os}/${host_arch}"
          if [[ "${PERF_BASELINE_AUTHORITY}" == github-hosted-ubuntu-*-x64 ]]; then
            if [[ "${host_os}" != "Linux" || "${host_arch}" != "x86_64" ]]; then
              echo "ERROR: Baseline init forbidden on ${host_os}/${host_arch} for authority=${PERF_BASELINE_AUTHORITY}"
              echo "Expected: Linux/x86_64"
              exit 3
            fi
          fi
          echo "✓ Environment validated for baseline init"
      
      - name: Init perf baseline (expected fail-closed with baseline write)
        run: |
          set -euo pipefail
          set +e
          make ci-gate-performance
          rc=$?
          set -e
          echo "ci-gate-performance exit code: ${rc}"
          if [ "${rc}" -ne 2 ]; then
            echo "ERROR: Unexpected exit code from ci-gate-performance: ${rc}"
            echo "Expected: 2 (fail-closed with baseline write)"
            exit "${rc}"
          fi
          test -f scripts/ci/perf-baseline.lock.json
      
      - name: Show generated baseline
        run: |
          set -euo pipefail
          ls -la scripts/ci/perf-baseline.lock.json
          echo "=== Baseline content (first 120 lines) ==="
          sed -n '1,120p' scripts/ci/perf-baseline.lock.json

      - name: Commit and push baseline to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/perf-baseline.lock.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "perf(baseline): update lock for ${PERF_CI_IMAGE_DIGEST} via authorized CI workflow ${RUN_ID}"
            git push origin HEAD:main
            echo "✓ Baseline committed and pushed to main"
          fi

      - name: Debug artifact paths before upload
        if: ${{ always() }}
        run: |
          set -euo pipefail
          echo "=== Lock file check ==="
          ls -la scripts/ci/perf-baseline.lock.json || echo "MISSING: perf-baseline.lock.json"
          echo "=== Evidence directory check ==="
          find evidence -maxdepth 4 -type f 2>/dev/null | head -20 || echo "MISSING: evidence directory"
      
      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-evidence
          if-no-files-found: error
          path: |
            scripts/ci/perf-baseline.lock.json
            evidence/run-*/gates/performance/**
