name: perf-baseline-init

on:
  workflow_dispatch:
    inputs:
      ci_image_digest:
        description: "Pinned runner image/build digest (optional)"
        required: false
        default: ""

jobs:
  init_baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RUN_ID: "init-${{ github.run_id }}-${{ github.run_attempt }}"
      PERF_INIT_BASELINE: "1"
      PERF_BASELINE_AUTHORITY: "github-hosted-ubuntu-latest-x64"
      PERF_REQUIRE_CI_FOR_BASELINE_INIT: "1"
      PERF_QEMU_TIMEOUT: "30"
      PERF_KERNEL_PROFILE: "validation"
      PERF_ENV_MISMATCH_POLICY: "fail"
    steps:
      - uses: actions/checkout@v4
      
      - name: Install toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 clang lld nasm jq
      
      - name: Resolve baseline init digest
        run: |
          set -euo pipefail
          INPUT_DIGEST="${{ github.event.inputs.ci_image_digest }}"
          if [ -n "${INPUT_DIGEST}" ]; then
            DIGEST="${INPUT_DIGEST}"
          else
            DIGEST="gha-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH:-unknown}"
          fi
          echo "PERF_CI_IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
      
      - name: Validate baseline init digest
        run: |
          set -euo pipefail
          if [ -z "${PERF_CI_IMAGE_DIGEST}" ] || echo "${PERF_CI_IMAGE_DIGEST}" | grep -q "unknown"; then
            echo "ERROR: ci_image_digest could not be resolved"
            echo "PERF_CI_IMAGE_DIGEST=${PERF_CI_IMAGE_DIGEST}"
            exit 1
          fi
          echo "Using digest: ${PERF_CI_IMAGE_DIGEST}"
      
      - name: Init perf baseline (expected fail-closed with baseline write)
        run: |
          set -euo pipefail
          set +e
          make ci-gate-performance
          rc=$?
          set -e
          echo "ci-gate-performance exit code: ${rc}"
          if [ "${rc}" -ne 2 ]; then
            echo "ERROR: Unexpected exit code from ci-gate-performance: ${rc}"
            echo "Expected: 2 (fail-closed with baseline write)"
            exit "${rc}"
          fi
          test -f scripts/ci/perf-baseline.lock.json
      
      - name: Show generated baseline
        run: |
          set -euo pipefail
          ls -la scripts/ci/perf-baseline.lock.json
          echo "=== Baseline content (first 120 lines) ==="
          sed -n '1,120p' scripts/ci/perf-baseline.lock.json
      
      - name: Debug artifact paths before upload
        if: ${{ always() }}
        run: |
          set -euo pipefail
          echo "=== Lock file check ==="
          ls -la scripts/ci/perf-baseline.lock.json || echo "MISSING: perf-baseline.lock.json"
          echo "=== Evidence directory check ==="
          find evidence -maxdepth 4 -type f 2>/dev/null | head -20 || echo "MISSING: evidence directory"
      
      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-evidence
          if-no-files-found: error
          path: |
            scripts/ci/perf-baseline.lock.json
            evidence/run-*/gates/performance/**
