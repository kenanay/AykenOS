name: Observation Boundary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  observation-boundary:
    name: Observation Boundary Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run observation boundary check
        run: |
          chmod +x scripts/check_observation_boundary.sh
          ./scripts/check_observation_boundary.sh
      
      - name: Upload check results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observation-boundary-failure
          path: |
            scripts/check_observation_boundary.sh
          retention-days: 7
