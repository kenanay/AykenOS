name: Spec Purity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  spec-purity:
    name: Normative Spec Purity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run normative spec purity check
        run: |
          chmod +x scripts/check_spec_purity.sh
          ./scripts/check_spec_purity.sh

      - name: Upload check script on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spec-purity-failure
          path: |
            scripts/check_spec_purity.sh
            .kiro/specs/dev-loop-boot-monitoring/requirements.md
            .kiro/specs/dev-loop-boot-monitoring/tasks.md
          retention-days: 7
