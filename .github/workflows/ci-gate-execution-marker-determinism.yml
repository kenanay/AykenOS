# Author: Kenan AY
# Role: Developer / Architect / Designer / Implementer
# Attribution is workflow metadata only and has no runtime authority.
#
# Scope: validation-only two-boot result parity and invalid-order rejection.
# This candidate gate does not establish Phase-17 closure authority.

name: ci-gate-execution-marker-determinism

on:
  pull_request:
  workflow_dispatch:

jobs:
  execution-marker-determinism:
    name: "Phase-17 PR-2 - Result Determinism and Negative Evidence"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      RUN_ID: "gh-${{ github.run_id }}-${{ github.run_attempt }}"
      EVIDENCE_ROOT: "evidence"
      EXECUTION_MARKER_DETERMINISM_QEMU_TIMEOUT: "45"

    steps:
      - uses: actions/checkout@v6

      - name: Install QEMU and kernel toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 clang lld nasm jq mtools

      - id: gate
        name: Run deterministic result and invalid-order gate
        run: |
          set -euo pipefail
          make ci-gate-execution-marker-determinism \
            RUN_ID="${RUN_ID}" \
            EVIDENCE_ROOT="${EVIDENCE_ROOT}" \
            EXECUTION_MARKER_DETERMINISM_QEMU_TIMEOUT="${EXECUTION_MARKER_DETERMINISM_QEMU_TIMEOUT}"

      - name: Upload determinism evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-gate-execution-marker-determinism-${{ github.run_id }}
          path: |
            evidence/run-${{ env.RUN_ID }}/gates/execution-marker-determinism/
            evidence/run-${{ env.RUN_ID }}/reports/execution-marker-determinism.json
          if-no-files-found: warn
          retention-days: 30
