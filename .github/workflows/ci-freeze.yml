# CI Freeze Enforcement Workflow
#
# MODE: CONSTITUTIONAL (GitHub-hosted runners with baseline)
# See: docs/operations/CONSTITUTIONAL_CI_MODE.md
#
# Current state:
#   - Functional gates: ENFORCED (deterministic)
#   - Performance gate: ENFORCED (baseline-locked, fail on regression)
#   - Strict enforcement: ACTIVE (env_hash + regression checks)
#
# Baseline authority: scripts/ci/perf_authority.env
# Baseline lock: scripts/ci/perf-baseline.lock.json
# CI image digest: gha-ubuntu24-20260201.15.1-X64
# Runner: ubuntu-24.04 (pinned)

name: ci-freeze

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      init_perf_baseline:
        description: "Run performance baseline initialization flow"
        type: boolean
        required: true
        default: false
      ci_image_digest:
        description: "Pinned runner image/build digest (required for baseline init, ex: gha-ubuntu22-20260212.1-x64)"
        required: false
        default: ""
      enable_perf_split_metrics_shadow:
        description: "Enable non-authoritative split-metric shadow evaluation"
        type: boolean
        required: true
        default: false
      enable_perf_split_metrics_enforcement:
        description: "Enable split-metric enforcement scaffold"
        type: boolean
        required: true
        default: false
      enable_perf_enforce_entry:
        description: "Enable entry split-metric checks when scaffold enforcement is on"
        type: boolean
        required: true
        default: false
      enable_perf_enforce_return:
        description: "Enable return split-metric checks when scaffold enforcement is on"
        type: boolean
        required: true
        default: false
      enable_perf_enforce_pure:
        description: "Enable pure syscall split-metric checks when scaffold enforcement is on"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  freeze:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.init_perf_baseline != 'true' }}
    runs-on: ubuntu-24.04  # Pinned to match baseline authority
    timeout-minutes: 40
    env:
      CI: "true"
      RUN_ID: "gh-${{ github.run_id }}-${{ github.run_attempt }}"
      PERF_BASELINE_MODE: "constitutional"  # Baseline-locked, fail on regression
      PERF_REQUIRE_CI_FOR_BASELINE_INIT: "1"
      PERF_QEMU_TIMEOUT: "30"
      PERF_KERNEL_PROFILE: "validation"
      PERF_AUTHORITY_SALT: "${{ github.repository }}"  # Fork-safe drift authority namespace
      PERF_ENV_MISMATCH_POLICY: "fail"  # Constitutional mode: strict enforcement
      PERF_REGRESSION_POLICY: "fail"    # Constitutional mode: strict enforcement
      PERF_SPLIT_METRICS_SHADOW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_perf_split_metrics_shadow == 'true' && '1' || '0' }}
      PERF_SPLIT_METRICS_ENFORCEMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_perf_split_metrics_enforcement == 'true' && '1' || '0' }}
      PERF_ENFORCE_ENTRY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_perf_enforce_entry == 'true' && '1' || '0' }}
      PERF_ENFORCE_RETURN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_perf_enforce_return == 'true' && '1' || '0' }}
      PERF_ENFORCE_PURE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_perf_enforce_pure == 'true' && '1' || '0' }}
      GOVERNANCE_POLICY_KERNEL_PROFILE: "validation"
      PHASE10C_ENFORCE: "1"
      PHASE10C_C2_STRICT: "1"
      PHASE10C_C2_OWNER_SET: "2"
      PHASE10C_C2_REQUIRE_CURSOR_MARKER: "1"
      SYSCALL_OVMF_CODE: "/usr/share/OVMF/OVMF_CODE_4M.fd"
      SYSCALL_OVMF_VARS: "/usr/share/OVMF/OVMF_VARS_4M.fd"
      SYSCALL_V2_RUNTIME_TIMEOUT: "60"  # Hosted runner needs more time for userspace boot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load performance baseline authority
        run: |
          set -euo pipefail
          source scripts/ci/perf_authority.env
          : "${PERF_BASELINE_AUTHORITY:?PERF_BASELINE_AUTHORITY missing in scripts/ci/perf_authority.env}"
          echo "PERF_BASELINE_AUTHORITY=${PERF_BASELINE_AUTHORITY}" >> "$GITHUB_ENV"
          echo "Loaded PERF_BASELINE_AUTHORITY=${PERF_BASELINE_AUTHORITY}"
      - name: Debug git context
        run: |
          set -euo pipefail
          echo "=== Git Context ==="
          git rev-parse HEAD
          git rev-parse --short HEAD
          git log -1 --oneline
          git status --short --branch
          echo "=== Event Context ==="
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
      - name: Debug PR context
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          echo "=== PR Context ==="
          echo "Base SHA: ${{ github.event.pull_request.base.sha }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
      - name: Check baseline-update label
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name' | grep -q '^baseline-update$'; then
            echo "PERF_ALLOW_BASELINE_LOCK_MUTATION=1" >> "$GITHUB_ENV"
            echo "Baseline update label detected - allowing baseline lock mutation"
          else
            echo "PERF_ALLOW_BASELINE_LOCK_MUTATION=0" >> "$GITHUB_ENV"
            echo "No baseline update label - baseline lock immutability enforced"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve pinned CI image digest
        run: |
          set -euo pipefail
          DIGEST="gha-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH:-unknown}"
          if echo "${DIGEST}" | grep -q "unknown"; then
            echo "Unable to resolve CI image digest"
            exit 1
          fi
          echo "PERF_CI_IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
      - name: Install toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 clang lld nasm jq mtools
      - name: Toolchain sanity
        run: |
          set -euo pipefail
          uname -a
          clang --version | head -n1
          ld.lld --version | head -n1
          nasm -v
          qemu-system-x86_64 --version | head -n1
          mformat --version 2>&1 | head -n1 || echo "mtools: $(which mformat)"
          ls -l "${SYSCALL_OVMF_CODE}" "${SYSCALL_OVMF_VARS}" || true
          ld.lld --version | head -n1
          nasm -v
          qemu-system-x86_64 --version | head -n1
      - name: Compute drift authority hash
        id: drift_auth
        run: |
          set -euo pipefail
          AUTHORITY_HASH="$(bash -c 'source scripts/ci/lib-drift-persistence.sh; compute_authority_hash')"
          echo "authority_hash=${AUTHORITY_HASH}" >> "$GITHUB_OUTPUT"
          echo "Drift authority hash: ${AUTHORITY_HASH}"
      - name: Restore drift state cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-state
          key: drift-state-${{ steps.drift_auth.outputs.authority_hash }}
      - name: Freeze suite
        run: |
          set -euo pipefail
          make ci-freeze
      - name: Spec Validation Gate (Phase-17.5)
        if: ${{ hashFiles('.kiro/specs/**') != '' }}
        run: |
          set -euo pipefail
          echo "== SPEC VALIDATION GATE =="
          echo "Checking for specs requiring validation..."
          
          # Find all spec directories with validation infrastructure
          for spec_dir in .kiro/specs/*/; do
            if [ -f "$spec_dir/ci_gate_spec_validation.sh" ]; then
              echo "Found spec: $spec_dir"
              export SPEC_DIR="$spec_dir"
              make ci-gate-spec-validation
            fi
          done
          
          echo "✅ All spec validations passed"
      - name: Upload Spec Validation Evidence
        if: ${{ always() && hashFiles('.kiro/specs/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: spec-validation-evidence-${{ github.run_id }}
          path: |
            out/evidence/**/spec-validation/**
            .kiro/specs/**/reports/**
          retention-days: 30
          if-no-files-found: warn
      - name: Save drift state cache
        if: ${{ always() && hashFiles('.ci-state/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-state
          key: drift-state-${{ steps.drift_auth.outputs.authority_hash }}
      - name: Build Ayken CLI for advisory reporting
        if: ${{ always() }}
        id: ayken_build
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --manifest-path tools/ayken-cli/Cargo.toml
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Capture Ayken advisory snapshots
        if: ${{ always() }}
        id: ayken_snapshots
        run: |
          set +e
          CLI_AVAILABLE=false
          if [ "${{ steps.ayken_build.outputs.built }}" = "true" ] && [ -x "out/cargo/debug/ayken-cli" ]; then
            CLI_AVAILABLE=true
          fi

          if [ "${CLI_AVAILABLE}" = "true" ]; then
            out/cargo/debug/ayken-cli --json gate all > ayken-gate.json 2>/dev/null
            GATE_EXIT=$?
            out/cargo/debug/ayken-cli --json status > ayken-status.json 2>/dev/null
            STATUS_EXIT=$?
          else
            GATE_EXIT=1
            STATUS_EXIT=1
          fi

          if ! jq -e . ayken-gate.json >/dev/null 2>&1; then
            printf '%s\n' '{"target":"all","all_pass":false,"gates":[],"risk":{"authority":"unknown","lineage_confidence":null,"lineage_tainted":true,"ancestor_distance":null,"risk_level":"unknown","note":"Advisory gate snapshot unavailable."}}' > ayken-gate.json
          fi
          if ! jq -e . ayken-status.json >/dev/null 2>&1; then
            printf '%s\n' '{"effective_authority":"none","lineage_confidence":null,"nearest_verified_ancestor":null,"ancestor_distance":null,"note":"Advisory status snapshot unavailable."}' > ayken-status.json
          fi
          echo "gate_exit_code=${GATE_EXIT}" >> "$GITHUB_OUTPUT"
          echo "status_exit_code=${STATUS_EXIT}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build Ayken advisory contract
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -u -o pipefail
          JQ_FILTER='($gate[0] // {}) as $g | ($status[0] // {}) as $s | {authority: ($g.risk.authority // "unknown"), lineage_confidence: ($g.risk.lineage_confidence // null), risk_level: ($g.risk.risk_level // "unknown"), nearest_verified_ancestor: ($s.nearest_verified_ancestor // null), ancestor_distance: ($s.ancestor_distance // null), all_pass: ($g.all_pass // false), failing_gates: (($g.gates // []) | map(select(.result == "FAIL") | .gate))}'
          jq -n --slurpfile gate ayken-gate.json --slurpfile status ayken-status.json "${JQ_FILTER}" > ayken-comment.json
          CONTRACT_EXIT=$?
          if [ "${CONTRACT_EXIT}" -ne 0 ] || ! jq -e . ayken-comment.json >/dev/null 2>&1; then
            printf '%s\n' '{"authority":"unknown","lineage_confidence":null,"risk_level":"unknown","nearest_verified_ancestor":null,"ancestor_distance":null,"all_pass":false,"failing_gates":[]}' > ayken-comment.json
          fi
          exit 0
      - name: Write Ayken advisory summary
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          AUTH="$(jq -r '.authority // "unknown"' ayken-comment.json)"
          CONF="$(jq -r '.lineage_confidence // "-"' ayken-comment.json)"
          RISK="$(jq -r '.risk_level // "unknown"' ayken-comment.json)"
          NEAREST="$(jq -r '.nearest_verified_ancestor // "-"' ayken-comment.json)"
          DIST="$(jq -r '.ancestor_distance // "-"' ayken-comment.json)"
          PASS="$(jq -r '.all_pass' ayken-comment.json)"
          FAILS="$(jq -r '.failing_gates | join(", ")' ayken-comment.json)"

          {
            echo "## Ayken Advisory"
            echo ""
            echo "- Authority: **${AUTH}**"
            echo "- Confidence: **${CONF}**"
            echo "- Risk Level: **${RISK}**"
            echo "- Nearest Verified Ancestor: **${NEAREST}**"
            echo "- Distance: **${DIST} commits**"
            echo "- All Gates Pass: **${PASS}**"
            if [ -n "${FAILS}" ]; then
              echo "- Failing Gates: \`${FAILS}\`"
            fi
            echo ""
            echo "> Advisory only — does not override CI authority."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Ayken advisory PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        id: ayken_comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ayken-advisory -->';
            const summary = JSON.parse(fs.readFileSync('ayken-comment.json', 'utf8'));
            const failing = summary.failing_gates.length
              ? `\n- Failing Gates: \`${summary.failing_gates.join(', ')}\``
              : '';
            const body = [
              marker,
              '### Ayken Advisory',
              '',
              `- Authority: **${summary.authority}**`,
              `- Confidence: **${summary.lineage_confidence ?? '-'}**`,
              `- Risk: **${summary.risk_level}**`,
              `- Nearest Verified Ancestor: **${summary.nearest_verified_ancestor ?? '-'}**`,
              `- Distance: **${summary.ancestor_distance ?? '-'} commits**`,
              `- Gates: **${summary.all_pass ? 'PASS' : 'FAIL'}**${failing}`,
              '',
              '> Advisory only — does not override CI authority.',
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find(
                (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body,
                });
                core.setOutput('status', 'updated');
                core.setOutput('comment_id', String(existing.id));
              } else {
                const created = await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: context.issue.number,
                  body,
                });
                core.setOutput('status', 'created');
                core.setOutput('comment_id', String(created.data.id));
              }
            } catch (error) {
              core.warning(`Failed to publish Ayken advisory PR comment: ${error.message}`);
              core.setOutput('status', 'error');
              core.setOutput('error_message', error.message);
            }
      - name: Record Ayken advisory comment status
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          COMMENT_STATUS="${{ steps.ayken_comment.outputs.status }}"
          COMMENT_ERROR="${{ steps.ayken_comment.outputs.error_message }}"
          if [ -z "${COMMENT_STATUS}" ]; then
            COMMENT_STATUS="not-run"
          fi

          {
            echo "- PR Comment Publish: **${COMMENT_STATUS}**"
            if [ -n "${COMMENT_ERROR}" ]; then
              echo "- PR Comment Error: \`${COMMENT_ERROR}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance evidence on success
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            evidence/run-*/gates/performance/**
      - name: Dump gate violations on failure
        if: failure()
        run: |
          echo "=== Dumping gate violations ==="
          find evidence -name "violations.txt" -type f 2>/dev/null | while read f; do
            echo "=== $f ==="
            cat "$f"
            echo ""
          done || true
          echo "=== Dumping gate reports ==="
          find evidence -name "report.json" -type f 2>/dev/null | while read f; do
            echo "=== $f ==="
            cat "$f"
            echo ""
          done || true
          echo "=== Dumping syscall runtime diagnostics ==="
          find evidence -path "*/gates/syscall-v2-runtime/build.log" -type f 2>/dev/null | while read f; do
            echo "=== $f (head) ==="
            sed -n '1,200p' "$f"
            echo ""
          done || true
          find evidence -path "*/gates/syscall-v2-runtime/runs/*/command.log" -type f 2>/dev/null | while read f; do
            echo "=== $f (head) ==="
            sed -n '1,200p' "$f"
            echo ""
          done || true
          find evidence -path "*/gates/syscall-v2-runtime/runs/*/syscall_serial.log" -type f 2>/dev/null | while read f; do
            echo "=== $f (head) ==="
            sed -n '1,200p' "$f"
            echo ""
          done || true
          find evidence -path "*/gates/syscall-v2-runtime/runs/*/syscall_debugcon.log" -type f 2>/dev/null | while read f; do
            echo "=== $f (head) ==="
            sed -n '1,200p' "$f"
            echo ""
          done || true
      - name: Upload freeze evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            evidence/run-*/gates/**

  init_perf_baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.init_perf_baseline == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      RUN_ID: "init-${{ github.run_id }}-${{ github.run_attempt }}"
      PERF_INIT_BASELINE: "1"
      PERF_BASELINE_MODE: "provisional"  # Non-deterministic baseline
      PERF_REQUIRE_CI_FOR_BASELINE_INIT: "1"
      PERF_QEMU_TIMEOUT: "30"
      PERF_KERNEL_PROFILE: "validation"
      PERF_ENV_MISMATCH_POLICY: "fail"
      GOVERNANCE_POLICY_KERNEL_PROFILE: "validation"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load performance baseline authority
        run: |
          set -euo pipefail
          source scripts/ci/perf_authority.env
          : "${PERF_BASELINE_AUTHORITY:?PERF_BASELINE_AUTHORITY missing in scripts/ci/perf_authority.env}"
          echo "PERF_BASELINE_AUTHORITY=${PERF_BASELINE_AUTHORITY}" >> "$GITHUB_ENV"
          echo "Loaded PERF_BASELINE_AUTHORITY=${PERF_BASELINE_AUTHORITY}"
      - name: Install toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 clang lld nasm jq mtools
      - name: Resolve baseline init digest
        run: |
          set -euo pipefail
          INPUT_DIGEST="${{ github.event.inputs.ci_image_digest }}"
          DETECTED_DIGEST="gha-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH:-unknown}"
          if [ -z "${INPUT_DIGEST}" ]; then
            echo "ERROR: ci_image_digest input is required when init_perf_baseline=true"
            echo "Detected runner digest candidate: ${DETECTED_DIGEST}"
            exit 1
          fi
          DIGEST="${INPUT_DIGEST}"
          echo "PERF_CI_IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "DETECTED_CI_IMAGE_DIGEST=${DETECTED_DIGEST}" >> "$GITHUB_ENV"
      - name: Validate baseline init digest
        run: |
          set -euo pipefail
          if [ -z "${PERF_CI_IMAGE_DIGEST}" ] || echo "${PERF_CI_IMAGE_DIGEST}" | grep -q "unknown"; then
            echo "ERROR: ci_image_digest is not pinned."
            echo "DETECTED_CI_IMAGE_DIGEST=${DETECTED_CI_IMAGE_DIGEST:-unavailable}"
            exit 1
          fi
          if ! echo "${PERF_CI_IMAGE_DIGEST}" | grep -Eq '^gha-[A-Za-z0-9._-]+-[A-Za-z0-9._-]+-[A-Za-z0-9._-]+$'; then
            echo "ERROR: ci_image_digest format invalid."
            echo "Expected format: gha-<ImageOS>-<ImageVersion>-<RUNNER_ARCH>"
            exit 1
          fi
      - name: Init perf baseline (expected fail-closed with baseline write)
        run: |
          set -euo pipefail
          set +e
          make ci-gate-performance
          rc=$?
          set -e
          if [ "${rc}" -ne 2 ]; then
            echo "Unexpected exit code from ci-gate-performance: ${rc}"
            exit "${rc}"
          fi
          test -f scripts/ci/perf-baseline.lock.json
      - name: Show generated baseline
        run: |
          set -euo pipefail
          ls -la scripts/ci/perf-baseline.lock.json
          sed -n '1,120p' scripts/ci/perf-baseline.lock.json
      - name: Validate baseline lock matches checked out commit
        run: |
          set -euo pipefail
          BASELINE_SHA="$(jq -r '.git_sha // empty' scripts/ci/perf-baseline.lock.json)"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -z "${BASELINE_SHA}" ]; then
            echo "ERROR: Baseline lock is missing git_sha"
            exit 1
          fi
          if [ "${BASELINE_SHA}" != "${HEAD_SHA}" ]; then
            echo "ERROR: Baseline lock git_sha does not match checkout HEAD"
            echo "baseline.git_sha=${BASELINE_SHA}"
            echo "checkout.HEAD=${HEAD_SHA}"
            exit 1
          fi
      - name: Debug artifact paths before upload
        if: ${{ always() }}
        run: |
          set -euo pipefail
          echo "=== Lock file check ==="
          ls -la scripts/ci/perf-baseline.lock.json || echo "MISSING: perf-baseline.lock.json"
          echo "=== Evidence directory check ==="
          find evidence -maxdepth 4 -type f 2>/dev/null | head -20 || echo "MISSING: evidence directory"
      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-evidence
          if-no-files-found: error
          path: |
            scripts/ci/perf-baseline.lock.json
            evidence/run-*/gates/performance/**
