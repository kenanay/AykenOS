[package]
name = "ayken"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Kenan AY <kenanay@example.com>"]
description = "AykenOS Authentication and Protection System"
repository = "https://github.com/kenanay/AykenOS"
homepage = "https://github.com/kenanay/AykenOS"
documentation = "https://github.com/kenanay/AykenOS"
keywords = ["os", "kernel", "authentication", "protection"]
categories = ["os", "authentication"]

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
whoami = "1.4"

[lib]
name = "ayken"
path = "lib.rs"

[[bin]]
name = "ayken-auth"
path = "bin/main.rs"